<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>화평특허법률사무소</title>
    <link href="./common/user.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="./common/commomfc.js" defer></script>
  </head>
  <body class="min-h-screen bg-[#F8FAFC] text-gray-900">
    <!-- 모달버튼 시작 -->
    <div class="fixed bottom-10 right-10 z-[100]">
      <button
        onclick="toggleModal(true)"
        class="bg-blue-600 hover:bg-blue-700 text-white p-4 rounded-full shadow-2xl transition-transform hover:scale-110"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-8 w-8"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"
          />
        </svg>
      </button>
    </div>
    <!-- 모달버튼 끝 -->

    <!-- header 시작 -->
    <div id="header_component"></div>
    <!-- header 끝 -->

    <div class="container mx-auto max-w-[1100px] px-5">
      <!-- 본문 시작  -->
      <section class="relative h-[90vh] w-full overflow-hidden">
        <div class="absolute inset-0 w-full h-full transform scale-110">
          <img
            src="img/main_back4.png"
            class="w-full h-full object-cover object-center fixed"
            style="filter: brightness(0.7)"
            alt="Main Background"
          />
        </div>

        <div
          class="relative z-10 h-full flex flex-col items-center justify-center text-white text-center px-4"
        >
          <p
            class="reveal-up text-blue-400 font-bold tracking-[0.3em] mb-4 uppercase text-sm md:text-base"
          >
            Professional Patent Attorney
          </p>
          <h2
            class="reveal-up text-5xl md:text-7xl font-light mb-6 tracking-tight"
          >
            화평 <span class="font-bold">특허법률사무소</span>
          </h2>
          <div class="reveal-up w-12 h-[1px] bg-white/50 mb-6"></div>
        </div>

        <div
          class="absolute bottom-10 left-1/2 -translate-x-1/2 z-10 animate-bounce"
        >
          <svg
            class="w-6 h-6 text-white/70"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 14l-7 7m0 0l-7-7m7 7V3"
            ></path>
          </svg>
        </div>
      </section>

      <main
        class="relative z-20 bg-white -mt-20 rounded-t-[3rem] shadow-[0_-20px_50px_rgba(0,0,0,0.1)]"
      >
        <div class="container mx-auto px-6 py-24 max-w-4xl">
          <div class="reveal-up text-center mb-24">
            <span
              class="text-blue-600 font-bold text-sm tracking-widest mb-3 block"
              >GREETING</span
            >
            <h1
              class="text-4xl md:text-5xl font-bold text-gray-900 mb-10 leading-tight"
            >
              고객 여러분 <br class="md:hidden" />
              안녕하십니까?
            </h1>

            <p
              class="text-xl text-gray-600 leading-[2.2] break-keep font-light"
            >
              다년간의
              <strong class="text-gray-900 font-semibold"
                >특허청 심사관 경험</strong
              >과 심사국 심사과장, <br class="hidden md:block" />
              그리고 분쟁부서인
              <strong class="text-gray-900 font-semibold"
                >특허심판원 심판관</strong
              >을 역임한,<br />
              <strong class="text-gray-900 font-semibold">한복연</strong>
              변리사입니다.
            </p>
          </div>

          <div class="reveal-up flex flex-col items-center">
            <div class="relative max-w-2xl w-full">
              <div
                class="absolute -top-10 -left-10 text-[15rem] text-gray-50 font-serif leading-none -z-10 select-none"
              >
                “
              </div>
              <img
                src="img/owner.png"
                class="w-full rounded-2xl shadow-2xl relative z-10"
              />
              <div
                class="absolute -bottom-10 -right-10 text-[15rem] text-gray-50 font-serif leading-none -z-10 select-none"
              >
                ”
              </div>
            </div>

            <div class="w-full flex justify-end mt-12 pr-4">
              <img
                src="img/company/greeting_05.png"
                class="h-16 md:h-20 object-contain mix-blend-multiply"
                alt="서명"
              />
            </div>
          </div>
        </div>
      </main>
      <!-- 본문 끝  -->
    </div>

    <!-- 문의 모달 시작 -->
    <div id="modal_component"></div>
    <!-- 문의 모달 끝 -->

    <!-- footer 시작 -->
    <div id="footer_component"></div>
    <!-- footer 끝 -->

    <script src="./common/component_loader.js"></script>

    <script>
      // 스크롤 감지 애니메이션 (Intersection Observer)
      const observerOptions = {
        threshold: 0.1, // 요소가 10% 정도 보일 때 실행
      };

      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add("active");
          }
        });
      }, observerOptions);

      // .reveal-up 클래스를 가진 모든 요소를 감시
      document
        .querySelectorAll(".reveal-up")
        .forEach((el) => observer.observe(el));
    </script>
  </body>
</html>

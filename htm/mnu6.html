<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
  <head>
    <title>:::::: 화평특허법률사무소 ::::;</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <link href="../common/user.css" rel="stylesheet" type="text/css" />
    <script src="../common/commomfc.js" defer></script>
  </head>
  <body class="bg-[#EDEEE9] m-0 p-0 overflow-x-hidden">
    <div class="fixed bottom-10 right-10 z-[100]">
      <button
        onclick="toggleModal(true)"
        class="bg-blue-600 hover:bg-blue-700 text-white p-4 rounded-full shadow-2xl transition-transform hover:scale-110"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-8 w-8"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"
          />
        </svg>
      </button>
    </div>

    <div id="header_component"></div>

    <div class="relative w-full h-[250px] md:h-[300px] overflow-hidden">
      <div
        class="absolute inset-0 w-full h-full bg-cover bg-center bg-no-repeat"
        style="background-image: url('../img/sub_back.png')"
      ></div>
      <div
        class="absolute inset-0 bg-slate-900/40 flex flex-col items-center justify-center"
      >
        <h2
          class="text-white text-3xl md:text-5xl font-bold drop-shadow-md tracking-tight"
        >
          커뮤니티
        </h2>
        <p class="text-white/80 mt-2 font-light">
          지식재산권에 관한 최신 소식과 정보를 전해드립니다.
        </p>
      </div>
    </div>

    <main class="container mx-auto px-4 max-w-6xl relative z-20 -mt-12 pb-24">
      <section
        class="bg-white rounded-[2rem] shadow-xl shadow-slate-200/60 overflow-hidden border border-slate-100"
      >
        <div
          class="bg-slate-50/50 px-6 py-4 border-b border-slate-100 flex justify-end items-center text-xs text-slate-500"
        >
          <img src="../img/blit_01.gif" class="inline-block mr-2 opacity-60" />
          <a href="/index.html" class="hover:text-blue-600 transition">Home</a>
          <span class="mx-2 text-slate-300">/</span> 게시판
        </div>

        <div class="p-6 md:p-10">
          <div
            class="flex flex-col md:flex-row justify-between items-end mb-8 border-b border-slate-100 pb-6"
          >
            <div>
              <h3
                class="text-2xl font-bold text-slate-800 flex items-center gap-3"
              >
                <span class="w-1.5 h-8 bg-blue-600 rounded-full"></span>
                화평 게시판
              </h3>
              <p class="text-slate-500 text-sm mt-1">
                문의사항이나 최신 판례 정보를 확인하실 수 있습니다.
              </p>
            </div>
            <div class="hidden md:block text-right text-sm text-slate-400">
              Total: 413 posts
            </div>
          </div>

          <div class="min-h-[600px]">
            <div
              class="w-full overflow-hidden rounded-xl border border-slate-100 mb-8 bg-white"
            >
              <img
                src="../img/board.png"
                alt="게시판 목록"
                class="w-full h-auto block"
              />
            </div>

            <div
              class="flex flex-col items-center gap-8 py-4 border-t border-slate-50"
            >
              <div class="flex gap-1">
                <button
                  class="w-8 h-8 flex items-center justify-center rounded border border-slate-200 text-slate-400 hover:bg-slate-50 text-xs"
                >
                  처음
                </button>
                <button
                  class="w-8 h-8 flex items-center justify-center rounded bg-blue-600 text-white font-bold text-xs shadow-md"
                >
                  1
                </button>
                <button
                  class="w-8 h-8 flex items-center justify-center rounded border border-slate-200 text-slate-600 hover:bg-slate-50 text-xs"
                >
                  2
                </button>
                <button
                  class="w-8 h-8 flex items-center justify-center rounded border border-slate-200 text-slate-600 hover:bg-slate-50 text-xs"
                >
                  3
                </button>
                <button
                  class="w-8 h-8 flex items-center justify-center rounded border border-slate-200 text-slate-400 hover:bg-slate-50 text-xs"
                >
                  다음
                </button>
              </div>

              <div
                class="flex gap-2 w-full max-w-md bg-slate-50 p-2 rounded-lg border border-slate-200"
              >
                <select
                  class="bg-white border border-slate-200 rounded px-2 py-1 text-xs text-slate-600 outline-none"
                >
                  <option>제목</option>
                  <option>내용</option>
                </select>
                <input
                  type="text"
                  class="flex-1 bg-white border border-slate-200 rounded px-3 py-1 text-xs outline-none focus:border-blue-500"
                  placeholder="검색어를 입력하세요"
                />
                <button
                  class="bg-slate-700 text-white px-4 py-1 rounded text-xs font-bold hover:bg-slate-800"
                >
                  검색
                </button>
              </div>
            </div>
          </div>
        </div>

        <div
          class="h-2 bg-gradient-to-r from-blue-600 to-indigo-600 w-full opacity-80"
        ></div>
      </section>

      <div class="mt-8 flex justify-center gap-4">
        <a
          href="tel:042-487-2960"
          class="px-6 py-3 bg-white border border-slate-200 rounded-full text-sm font-bold text-slate-700 shadow-sm hover:shadow-md transition"
        >
          📞 전화로 바로 문의하기
        </a>
      </div>
    </main>

    <div id="modal_component"></div>
    <div id="footer_component"></div>

    <script src="../common/component_loader.js"></script>
  </body>
</html>

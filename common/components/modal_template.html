<div
  id="contactModal"
  class="fixed inset-0 z-[110] hidden bg-black bg-opacity-50 flex items-center justify-center p-4"
>
  <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl">
    <div class="flex justify-between items-center mb-4">
      <h3 class="text-xl font-bold text-gray-800">문의하기</h3>
      <button
        onclick="toggleModal(false)"
        class="text-gray-400 hover:text-gray-600"
      >
        &times;
      </button>
    </div>
    <div class="space-y-4">
      <a
        href="tel:042-487-2960"
        class="flex items-center p-4 bg-blue-50 rounded-xl hover:bg-blue-100 transition"
      >
        <span class="text-blue-600 mr-3">?</span>
        <div>

          <p class="font-bold text-gray-800">042-487-2960</p>
        </div>
      </a>
      <div class="flex items-center p-4 bg-green-50 rounded-xl">
        <span class="text-green-600 mr-3">??</span>
        <div>
          <p class="text-xs text-gray-500">이메일</p>
          <p class="font-bold text-gray-800">hp_patent@naver.com</p>
        </div>
      </div>
    </div>
    <button
      onclick="toggleModal(false)"
      class="w-full mt-6 py-3 bg-gray-100 text-gray-600 rounded-xl font-medium"
    >
      닫기
    </button>
  </div>
</div>
